[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-foundations-reproducible"
version = "0.1.0"
description = "Small reproducible implementations of foundational ML models"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "torch>=2.1", "torchvision>=0.16", "scikit-learn>=1.3", "matplotlib>=3.7", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
